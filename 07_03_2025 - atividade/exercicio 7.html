<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estilização de Subtítulos</title>
    <style>
        h2 {
            font-family: Arial, sans-serif;
            font-size: 20px;
            font-weight: bold;
            text-decoration: underline;
            color: maroon;
        }
        .desenvolvimento {
            color: #FFCC00;
        }
        .paragrafo1 {
            color: navy;
        }
        .paragrafo2 {
            color: white;
            background-color: black;
        }
        .paragrafo3 {
            color: black;
        }
    </style>
</head>
<body>

    <h2>O Desenvolvimento</h2>
    <p class="paragrafo1">Texto do primeiro parágrafo com cor navy.</p>

    <h2 class="desenvolvimento">Subtítulo Especial</h2>
    <p class="paragrafo2">Texto do segundo parágrafo com cor branca e fundo preto.</p>

    <h2>Conclusão</h2>
    <p class="paragrafo3">Texto do terceiro parágrafo com cor preta.</p>

</body>
</html>
