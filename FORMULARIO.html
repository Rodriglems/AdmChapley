<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MEU FORMULARIO</title>
    <style>
    /* Define o estilo do corpo da página */
    body{
        background-color: hwb(0 97% 3%); /* Define a cor de fundo da página */
        font-family: Verdana, Geneva, Tahoma, sans-serif; /* Define a fonte do texto */
        margin: 0;
        display: flex;
        height: 100vh;
        align-items: center;
        justify-content: center;
    }
    
    /* Estiliza o formulário */
    form{
        display: flex; /* Usa flexbox para organizar os elementos */
        flex-direction: column; /* Organiza os elementos em coluna */
        align-items: center; /* Centraliza os itens horizontalmente */
        justify-content: center; /* Centraliza os itens verticalmente */
       border: 2px  solid rgb(92, 89, 89);
       padding: 5px;
       border-radius: 10px;

    }
    
    /* Estiliza o botão */
    button{
        margin: 5px; /* Define uma margem externa de 5px */
        padding: 5px; /* Define um espaçamento interno de 5px */
        background-color: hsl(7, 85%, 50%); /* Cor de fundo do botão */
        border: 1px solid; /* Define a borda do botão */
        color: rgb(252, 250, 250); /* Define a cor do texto dentro do botão */
        border-radius: 5px; /* Arredonda os cantos do botão */
        cursor: pointer; /* Muda o cursor para uma mãozinha ao passar sobre o botão */
    }
    input{
        /*remover as bordas*/
        border: 0;
        /*mudar a cor de fundo*/
        background-color: #df2810;
        /*arredondar as bodas em 10px*/
        border-radius: 10px;
        /*aumentar um pouco a margem interna*/
        padding: 7px;
        color: rgb(237, 228, 228);
    }
    </style>
</head>
<body>

    <form action="#" method="post">
      Nome:  
    <input type="text" name="nome" id="nome" autocomplete="off" placeholder="Digite seu nome completo">
    CPF:
    <input type="text" name="cpf" id="cpf" autocomplete="off" placeholder="Digite apenas os numeros">
    Data de nascimento:
    <input type="date" name="nascimento" id="nascimento">
    <button>Cadastrar</button>

</body>
</html>
